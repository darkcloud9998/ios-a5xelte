name: herolte-ssh

# The live channel's programs for the S7's iOS userland (tools/ssh/build-ssh-ios.sh). No keys here: they are made on
# the PC and go to the phone through the drop zone.
on:
  workflow_dispatch:
  push:
    branches: [herolte-sync-upstream]
    paths:
      - "tools/ssh/**"
      - ".github/workflows/herolte-ssh.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash tools/ssh/build-ssh-ios.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: herolte-ssh
          path: out/
