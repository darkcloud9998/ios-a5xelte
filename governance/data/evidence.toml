note = "Sin herostop el kernel NO sigue ni reinicia: se queda en el bloque 19. Con los kernels sin alias virtual (0338-0342) el mismo punto terminaba en reinicio; con el alias (0343/0344) termina colgado. Hipótesis más probable: tras apagar TTBR0 algo falla y el dibujo por el alias virtual también (el pánico no se ve), de modo que el kernel se queda en bucle. La sonda 0345 comprueba el alias antes de apagar TTBR0."

